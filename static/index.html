<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CNPJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Consulta de CNPJ</h1>
        <div class="mb-4">
            <input
                type="text"
                id="cnpjInput"
                placeholder="Digite o CNPJ (somente números)"
                class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>
        <button
            id="searchButton"
            class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600"
        >
            Pesquisar
        </button>
        <div id="result" class="mt-4 p-4 border rounded hidden"></div>
        <div id="error" class="mt-4 p-4 border rounded bg-red-100 text-red-700 hidden"></div>
    </div>
    <script src="/static/js/main.js"></script>
</body>
</html>
